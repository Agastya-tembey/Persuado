<!DOCTYPE html>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="site-nav site-nav--content site-nav--compact" aria-label="Primary navigation">
    <a class="site-nav__brand" href="index.html">Persuado</a>
    <div class="site-nav__links">
      <a class="site-nav__link" href="index.html">Home</a>
      <a class="site-nav__link" href="un-resources.html">Research</a>
      <a class="site-nav__link" href="countries.html">Countries</a>
      <a class="site-nav__link" href="sample-resolution.html">Templates</a>
      <a class="site-nav__link" href="opening-statements.html">Speeches</a>
      <a class="site-nav__link" href="debate-checklist.html">MUN Checklist</a>

      <a class="site-nav__link" href="about.html">About</a>
    </div>
    <div class="site-nav__actions"><div id="navAuthLinks"></div></div>
  </nav>

  <div class="auth-shell">
    <div class="form-card">
      <h1>Welcome back</h1>
      <p>Sign in with your email and password to access your Persuado dashboard.</p>

      <form id="loginForm" class="auth-form">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" name="loginEmail" type="email" placeholder="you@example.com" required>

        <label for="loginPassword">Password</label>
        <input id="loginPassword" name="loginPassword" type="password" placeholder="Enter your password" required>

        <button id="loginButton" class="button button-primary" type="submit">Login</button>
      </form>

      <div id="loginMessage" class="message-box hidden"></div>

      <div class="auth-footer">
        <p><a href="forgot-password.html">Forgot password?</a></p>
        <p>New to Persuado? <a href="signup.html">Create a free account</a></p>
      </div>
    </div>
  </div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
