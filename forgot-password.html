  <div class="auth-shell">
    <div class="form-card">
      <h1>Reset your password</h1>
      <p>Enter the email address linked to your account and we'll send a password reset link.</p>

      <form id="resetForm" class="auth-form">
        <label for="resetEmail">Email</label>
        <input id="resetEmail" name="resetEmail" type="email" placeholder="you@example.com" required>

        <button id="resetButton" class="button button-primary" type="submit">Send reset email</button>
      </form>

      <div id="resetMessage" class="message-box hidden"></div>

      <div class="auth-footer">
        <p>Remembered your password? <a href="login.html">Login</a></p>
      </div>
    </div>
  </div>
  <script type="module" src="js/auth.js"></script>
</body>
