<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup | Persuado</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-shell">
    <div class="form-card">
      <h1>Create your free account</h1>
      <p>Sign up with email and password to save notes, bookmarks, progress, and your personal dashboard.</p>

      <form id="signupForm" class="auth-form">
        <label for="fullName">Full Name</label>
        <input id="fullName" name="fullName" type="text" placeholder="Your full name" required>

        <label for="signupEmail">Email</label>
        <input id="signupEmail" name="signupEmail" type="email" placeholder="you@example.com" required>

        <label for="signupPassword">Password</label>
        <input id="signupPassword" name="signupPassword" type="password" placeholder="Create a strong password" required>

        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm your password" required>

        <button id="signupButton" class="button button-primary" type="submit">Create account</button>
      </form>

      <div id="signupMessage" class="message-box hidden"></div>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
  </div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
